<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <title>3D 棋盤迷宮 (最終修正版)</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; color: #fff; font-family: 'Courier New', Courier, monospace; }
        #scene-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: transform 0.1s; }
        .overlay { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; z-index: 10; background-color: rgba(0,0,0,0.8); }
        #start-screen { background-color: #ffffff; transition: background-color 1.5s ease-in-out; }
        
        #game-over-screen { 
            background-color: transparent; 
            transition: background-color 1s ease-in-out; 
            justify-content: center;
            padding-bottom: 40vh;
        }
        #game-over-screen h1, #game-over-screen p { 
            opacity: 0; 
            transition: opacity 1s ease-in-out;
        }
        #game-over-screen h1 {
            color: red;
            font-size: 15vh; 
            transform: scale(0.7, 1.5);
            text-shadow: 0 0 10px red;
            font-weight: 300;
            display: flex;
            align-items: center;
            letter-spacing: 5px;
        }
        #game-over-screen h1 span { display: inline-block; }
        #game-over-screen h1 .char1 { transform: translateY(-0.2em); }
        #game-over-screen h1 .char2 { transform: translateY(0.1em); }
        #game-over-screen h1 .char3 { transform: translateY(-0.25em); }
        #game-over-screen h1 .char4 { transform: translateY(0.15em); }
        #game-over-screen h1 .char5 { transform: translateY(-0.1em); }
        #game-over-screen p {
            color: white;
            font-size: 20px;
        }

        #instructions { width: 90%; max-width: 650px; }
        #loading-text { font-size: 24px; margin-top: 20px; color: #000; }
        .ui-element { position: absolute; padding: 8px 12px; border-radius: 5px; font-size: 16px; text-shadow: 1px 1px 2px #000; z-index: 5; display: none; transition: background-color: 0.3s ease, font-size: 0.5s ease, padding 0.5s ease; }
        #san-bar-container { right: 15px; top: 5px; display: none; align-items: center; background: rgba(0,0,0,0.25); padding: 6px 10px; } 
        #san-bar-container span { font-size: 15px; transform: scaleX(0.9); margin-right: 5px; }
        #san-bar-outer { width: 90px; height: 15px; background: #444; border: 1px solid #666; border-radius: 4px; }
        #san-bar-inner { width: 100%; height: 100%; background: #22dd22; border-radius: 3px; transition: width 0.2s linear, background-color 0.5s ease; }
        
        #treasure-counter-text {
            left: 10px; top: 10px;
            font-size: 18px;
            color: #fff;
            text-shadow: 0 0 8px #ffd700;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            pointer-events: none;
        }

        #treasure-canvas {
            position: absolute;
            top: 5px; left: 5px;
            width: 110px; height: 110px;
            z-index: 5;
            display: none;
        }
        
        #status-effect-container {
            position: absolute;
            top: 45px;
            right: 15px;
            z-index: 5;
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
        }
        #status-tooltip {
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 5px 8px;
            border-radius: 4px;
            margin-right: 8px;
            font-size: 14px;
            text-align: right;
            border: 1px solid rgba(255,255,255,0.3);
            display: none;
        }
         #status-tooltip p {
            margin: 0;
            white-space: nowrap;
         }
        #status-tooltip .title {
            font-weight: bold;
            font-size: 15px;
        }
         #status-tooltip .desc {
            font-size: 12px;
            color: #ccc;
         }
        #status-icon {
            width: 36px;
            height: 36px;
            position: relative;
            cursor: pointer;
            display: none;
        }
        #status-timer {
            position: absolute;
            bottom: -2px;
            right: -2px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px black;
        }

        .status-icon-wrapper {
            position: absolute;
            right: 0; /* 所有圖示都靠右對齊 */
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            transition: top 0.3s ease-in-out; /* 向上遞補時的平滑動畫 */
            height: 38px;
        }

        /* [修正] 恢復 tooltip 的原始樣式與行為 */
        .status-icon-wrapper .status-tooltip {
             color: #fff;
             background: rgba(0,0,0,0.7);
             padding: 5px 8px;
             border-radius: 4px;
             margin-right: 8px;
             font-size: 14px;
             text-align: right;
             border: 1px solid rgba(255,255,255,0.3);
             display: none; /* 預設隱藏 */
             position: absolute;
             top: 0;
             right: 39px; /* 放在圖示左邊 */
        }
        .status-icon-wrapper .status-tooltip p {
            margin: 0;
            white-space: nowrap;
         }
        .status-icon-wrapper .status-tooltip .title {
            font-weight: bold;
            font-size: 12px;
        }
         .status-icon-wrapper .status-tooltip .desc {
            font-size: 10px;
            color: #ccc;
         }
        
        .status-icon-wrapper .status-icon {
            width: 36px;
            height: 36px;
            position: relative;
            cursor: pointer;
            font-size: 32px; /* 用字體大小來控制 emoji 圖示大小 */
            line-height: 36px;
            text-align: center;
            filter: drop-shadow(0 0 2px black);
        }

        /* 圖示右下角的倒計時計數器 */
        .status-icon .status-timer {
            position: absolute;
            bottom: -7px;
            right: -3px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px black;
        }

        .status-icon .status-stacks {
            position: absolute;
            top: -9px;
            left: -4px;
            width: 18px;    /* 固定寬度 */
            height: 18px;   /* 固定高度 */
            font-size: 12px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px black;
            background-color: rgba(200, 0, 0, 0.8);
            border-radius: 50%; /* 變成圓形 */
            display: flex;      /* 使用 Flexbox 來讓數字置中 */
            justify-content: center;
            align-items: center;
            line-height: 1;     /* 移除多餘行高 */
            padding: 0;         /* 移除內邊距 */
        }

        /* 恐懼爆發的合併爆炸特效 */
        .explosion-effect {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            opacity: 1;
            animation: explosion 0.4s ease-out forwards;
        }
        .explosion-effect::before,
        .explosion-effect::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, #ffd700 20%, transparent 70%);
            border-radius: 50%;
        }
        .explosion-effect::before {
            animation: explosion-sub 0.4s ease-out 0.05s forwards;
        }
        .explosion-effect::after {
            animation: explosion-sub 0.4s ease-out 0.1s forwards;
        }

        @keyframes explosion {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(5); opacity: 0; }
        }
        @keyframes explosion-sub {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }

        /* [新增] 開始畫面的背景圖樣式 */
#start-bg-container {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;

}
#start-bg-image {
    position: absolute;
    top: 50%; left: 50%;

}
/* [新增] 右上角信件圖示樣式 */
#info-icon {
    position: absolute;
    top: 45px;
    right: 15px;
    font-size: 36px;
    cursor: pointer;
    z-index: 15;
    opacity: 0;
    transition: opacity 1s ease-in-out;

}
#info-badge {

    align-items: center;
    font-size: 14px;
    font-weight: bold;
    line-height: 1;
    border: 2px solid white;
}
/* [新增] 遊戲說明彈出視窗樣式 */
#info-modal {
    background-color: rgba(0,0,0,0.7);
    z-index: 20;
    cursor: pointer;
}
#info-modal-content {
    width: 90%;
    max-width: 650px;
    background: rgba(255, 255, 255, 0.95);
    color: #333;
    padding: 25px 35px;
    border-radius: 10px;
    font-family: 'Courier New', Courier, monospace;
    font-size: 16px;
    line-height: 1.6;
    text-align: left; /* 文字齊左 */
    cursor: default;
}

        @keyframes damage-flash { 0% { background-color: rgba(255, 0, 0, 0.6); } 100% { background-color: rgba(0, 0, 0, 0.25); } }
        .damage-flash-short { animation: damage-flash 0.4s ease-out; }
        .damage-flash-long { animation: damage-flash 0.8s ease-out; }
        
        #win-screen { display: none; background-color: rgba(0,0,0,0.85); }
        #win-screen h1 { font-size: 48px; color: #ffd700; text-shadow: 0 0 15px #ffd700; }
        .restart-button { margin-top: 20px; padding: 15px 30px; font-size: 20px; background: #fff; border: none; color: #000; cursor: pointer; border-radius: 5px; font-weight: bold; }
        #joystick-base, #joystick-handle { position: absolute; border-radius: 50%; display: none; pointer-events: none; z-index: 6; }
        #joystick-base { width: 120px; height: 120px; background: rgba(255, 255, 255, 0.2); }
        #joystick-handle { width: 60px; height: 60px; background: rgba(255, 255, 255, 0.4); }
        #orientation-overlay { display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; background-color: #000; }
        #orientation-overlay p { font-size: 20px; color: #fff; padding: 20px; }

        @keyframes rotate-animation { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
        
        #vignette-canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 7; display: none;
        }

        /* [請在這裡新增] 落雷特效的 CSS 動畫 */
        .lightning-bolt {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 100%;
            background-color: white;
            box-shadow: 0 0 10px 5px #ff4444, 0 0 20px 10px #ff8888;
            opacity: 0;
            transform-origin: top center;
            animation: lightning-strike 0.5s ease-out;
            z-index: 100; /* 確保在最頂層 */
        }

        /* [請在這裡新增] 創傷反應暗角的 CSS */
    #trauma-vignette-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 4; /* 比觸手高，比其他UI低 */
        display: none; /* 預設隱藏 */
    }

        @keyframes lightning-strike {
            0% { transform: translateY(-100px) scaleY(0); opacity: 0; }
            20% { transform: translateY(0) scaleY(1); opacity: 1; }
            80% { transform: translateY(0) scaleY(1); opacity: 1; }
            100% { transform: translateY(0) scaleY(1); opacity: 0; }
        }
        
        @media (orientation: portrait) { #orientation-overlay { display: flex; } #scene-container, #san-bar-container, #joystick-base, #joystick-handle, #treasure-canvas, #treasure-counter-text { display: none !important; } }
    </style>
</head>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        let infoIcon, infoModal, infoModalContent, infoBadge, startBgContainer;
const gameDescription = "光明的黑暗的、善良的破碎的、討喜的難搞的、自信的自卑的……每個碎片都是自己的一部分，再探索中蒐集他們，完整自己。外界的推移、碰撞，和探索過程中產生的創傷、恐懼，都會降低心智的理智值。";

        const DUCK_SETTINGS = {
            COUNT: 12,      // 鴨子的總數量
            HEIGHT: 39,     // 鴨子在空中的高度
            SIZE: 6,        // 鴨子的長度大小 (米)
            SPEED: 12,       // 鴨子的移動速度
            TURN_SPEED: 1.5 // 鴨子的轉身速度
        };
        
        const DUCK_NOD_SETTINGS = {
            SPEED: 4,   // 點頭速度：數值越大，點頭越快。
            ANGLE: 0.5 // 點頭幅度：數值越大，抬頭和低頭的角度越大。(0.35 約等於 20 度)
        };

        // 恐懼爆發 疊層邏輯的設定
        const FEAR_ERUPTION_CONFIG = {
            STACK_PER_DISTANCE: 1, // 玩家每移動 1.5 個單位，疊加一層
            STACK_PER_ROTATION: 10 * (Math.PI / 180) // 玩家每轉動 10 度，疊加一層 (10度需轉換為弧度)
        };

        // 創傷反應 狀態的設定
        const TRAUMA_REACTION_CONFIG = {
            AUTO_MOVE_SPEED: 360 // 自動前進時的速度
        };

        const TRAUMA_VIGNETTE_CONFIG = {
            COLOR: 'rgba(80, 20, 50, 0.99)', // 暗角顏色 (偏紅的暗紫色)
            SIZE: 0.01, // 中心可見範圍的大小 (數值越小，暗角越大)
            FEATHER: 0.36 // 邊緣模糊/羽化的程度 (數值越大，邊緣越模糊)
        };

        function updateTraumaVignette() {
        const canvas = document.getElementById('trauma-vignette-canvas');
        if (!canvas) return;

        if (player.userData.isTraumaActive) {
            canvas.style.display = 'block';
            const ctx = canvas.getContext('2d');
            // 確保 canvas 尺寸與視窗一致
            if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);

            const centerX = w / 2;
            const centerY = h / 2;
            const innerRadius = w * TRAUMA_VIGNETTE_CONFIG.SIZE;
            const outerRadius = w * TRAUMA_VIGNETTE_CONFIG.FEATHER;

            const gradient = ctx.createRadialGradient(centerX, centerY, innerRadius, centerX, centerY, outerRadius);
            gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
            gradient.addColorStop(1, TRAUMA_VIGNETTE_CONFIG.COLOR);

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, w, h);
        } else {
            canvas.style.display = 'none';
        }
    }
        
        const statusEffectManager = {
            activeStatuses: [],
            isMerging: false,
            statusData: {
                'huntingMark': { name: '狩獵印記', icon: `<svg viewBox="0 0 100 100" style="width: 100%; height: 100%; filter: drop-shadow(0 0 2px black); transform: rotate(200deg);"><path d="M28,15 C30,17 40,50 35,83 L31,85 C36,50 26,17 28,15 Z" fill="#E53E3E" /><path d="M48,15 C50,17 60,50 55,83 L51,85 C56,50 46,17 48,15 Z" fill="#E53E3E" /><path d="M68,15 C70,17 80,50 75,83 L71,85 C76,50 66,17 68,15 Z" fill="#E53E3E" /></svg>`, desc: '被附上狩獵印記時遭到凝視，會造成"恐懼爆發"' },
                'gaze': { name: '慾念凝視', icon: '👁️', desc: '受到慾念凝視時，若身上有狩獵印記，會造成"恐懼爆發"' },
                'fearEruption': { name: '恐懼爆發', icon: '☠️', desc: '恐懼爆發期間，任何移動都會疊加恐懼值，恐懼值達至10層會產生"創傷反應"' },
                'trauma': { name: '創傷反應', icon: '💔', desc: '因創傷而產生激烈反應，不受控的暴衝來試圖逃避恐懼' }
            },
            
            // [全新] 統一的 tooltip 隱藏管理器，取代舊的錯誤方法
            init() {
                document.addEventListener('pointerup', () => this.hideAllTooltips(), true);
                document.addEventListener('touchend', () => this.hideAllTooltips(), true);
            },
            hideAllTooltips() {
                this.activeStatuses.forEach(status => {
                    const tooltip = status.element.querySelector('.status-tooltip');
                    if (tooltip) tooltip.style.display = 'none';
                });
            },

            hasStatus(id) { return this.activeStatuses.some(s => s.id === id); },
            getStatus(id) { return this.activeStatuses.find(s => s.id === id); },

            addStatus(id, duration, stacks = 1) {
                const existingStatus = this.getStatus(id);
                if (existingStatus) {
                    if (duration !== Infinity) {
                        existingStatus.endTime = performance.now() + duration * 1000;
                    }
                    if(id === 'fearEruption') { this.updateStacks('fearEruption', existingStatus.stacks); }
                } else {
                    const data = this.statusData[id];
                    if (!data) return;
                    const newStatus = {
                        id: id,
                        endTime: duration === Infinity ? Infinity : performance.now() + duration * 1000,
                        duration: duration,
                        stacks: stacks,
                        element: this.createElement(id, data)
                    };
                    this.activeStatuses.push(newStatus);
                    document.getElementById('status-effect-container').appendChild(newStatus.element);
                    if(id === 'fearEruption') { this.updateStacks('fearEruption', 1); }
                }
                this.updateUI();
            },

            removeStatus(id) {
                const index = this.activeStatuses.findIndex(s => s.id === id);
                if (index > -1) {
                    const [removedStatus] = this.activeStatuses.splice(index, 1);
                    if (removedStatus.element) removedStatus.element.remove();
                    this.updateUI();
                }
            },

            updateStacks(id, newStacks) {
                const status = this.getStatus(id);
                if (status) {
                    status.stacks = newStacks;
                    const stacksElement = status.element.querySelector('.status-stacks');
                    if (stacksElement) {
                        stacksElement.textContent = newStacks;
                        stacksElement.style.display = newStacks > 0 ? 'block' : 'none';
                    }
                }
            },
            
            // [全新] 徹底修正事件監聽器，不再汙染全域
            createElement(id, data) {

function handleDeviceTilt(event) {
    // event.gamma 是左右傾斜角度 (-90 to 90)
    if (!gameStarted && event.gamma != null) {
        const tiltLR = event.gamma;
        const maxTilt = 30; // 將 +/- 30度的傾斜視為最大範圍
        const maxMove = 42; // 背景圖最大移動的像素值

        // 限制傾斜值在我們的最大範圍內
        const clampedTilt = Math.max(-maxTilt, Math.min(maxTilt, tiltLR));

        // 計算移動百分比 (-1 to 1)
        const movePercent = clampedTilt / maxTilt;

        // 計算最終移動的像素值 (向右傾斜 gamma 為正，圖片向左移，所以 tx 為負)
        const tx = -movePercent * maxMove;

        const bgImage = document.getElementById('start-bg-image');
        if (bgImage) {
            // 在原有的置中與縮放基礎上，加上我們的橫向移動
            bgImage.style.transform = `translate(calc(-50% + ${tx}px), -50%)`;
        }
    }
}

        function createModelInstance(modelName, targetHeight) {
            const model = loadedModels[modelName];
            if (!model) { return null; }
            
            const modelInstance = model.clone();
            const box = new THREE.Box3().setFromObject(modelInstance);
            const size = box.getSize(new THREE.Vector3());
            if (size.y === 0 || !isFinite(size.y)) { return null; }

            const scale = targetHeight / size.y;
            modelInstance.scale.set(scale, scale, scale);
            
            const newBox = new THREE.Box3().setFromObject(modelInstance);
            const center = newBox.getCenter(new THREE.Vector3());
            
            const wrapper = new THREE.Group();
            wrapper.add(modelInstance);
            modelInstance.position.x = -center.x;
            modelInstance.position.y = -newBox.min.y;
            modelInstance.position.z = -center.z;
            
            const finalBox = new THREE.Box3().setFromObject(wrapper);
            const finalSize = finalBox.getSize(new THREE.Vector3());
            wrapper.userData.collisionRadius = Math.max(finalSize.x, finalSize.z) / 2;

            return wrapper;
        }

// --- 漩渦動畫函式 ---
function startVortexAnimation(position) {
    if (!vortexTexture) return;
    if (vortexManager.pivot) scene.remove(vortexManager.pivot);

    const baseMaterial = new THREE.MeshBasicMaterial({
        map: vortexTexture,
        transparent: true,
        opacity: 1.0,
        alphaTest: 0.1,
        side: THREE.DoubleSide
    });
    const geometry = new THREE.PlaneGeometry(1, 1);

    const vortexUpright = new THREE.Mesh(geometry, baseMaterial);
    const vortexTilted = new THREE.Mesh(geometry, baseMaterial.clone());
    vortexTilted.rotation.x = Math.PI / 1.8;

    const pivot = new THREE.Group();
    pivot.add(vortexUpright);
    pivot.add(vortexTilted);

    const desiredDiameter = 78;

    // --- 【關鍵修正】恢復位置與高度設定 ---

    // 1. 計算BOSS的正前方向量
    const forward = new THREE.Vector3(0, 0, 1);
    forward.applyQuaternion(bossManager.mesh.quaternion);

    // 2. 設定軸心點的初始位置在BOSS中心
    pivot.position.copy(position);

    // 3. 提高到您想要的頭部高度
    pivot.position.y += 30; 

    // 4. 沿著BOSS的正前方，將整個特效推出33米
    pivot.position.add(forward.multiplyScalar(33));

    // --- (後面不變) ---
    pivot.scale.set(0, 0, 0);

    scene.add(pivot);
    vortexManager.pivot = pivot;
    vortexManager.active = true;
    vortexManager.animation = {
        state: 'scaling_in',
        startTime: performance.now(),
        targetScale: desiredDiameter
    };
}

function updateVortex(time, delta) {
    if (!vortexManager.active || !vortexManager.pivot) return;

    const anim = vortexManager.animation;
    const elapsed = time - anim.startTime;
    const pivot = vortexManager.pivot;

    // --- 【關鍵修正】 ---
    // 每一幀都讓整個軸心點(包含兩個漩渦)面向攝影機
    pivot.lookAt(camera.position);
    // --- 【修正結束】 ---

    // 讓軸心點裡的兩個漩渦「各自」維持自己的原地自轉
    const rotationSpeed = 4;
    pivot.children.forEach(child => {
        child.rotation.z += rotationSpeed * delta;
    });

    switch (anim.state) {
        case 'scaling_in': {
            const duration = 1000;
            const progress = Math.min(elapsed / duration, 1);
            const scale = anim.targetScale * progress * progress;
            pivot.scale.set(scale, scale, scale);
            if (progress >= 1) {
                anim.state = 'spinning';
                anim.startTime = time;
            }
            break;
        }
        case 'spinning': {
            const duration = 2000;
            if (elapsed >= duration) {
                anim.state = 'fading_out';
                anim.startTime = time;
            }
            break;
        }
        case 'fading_out': {
            const duration = 500;
            const progress = Math.min(elapsed / duration, 1);
            const opacity = 1.0 - progress;
            pivot.children.forEach(child => {
                child.material.opacity = opacity;
            });

            if (progress >= 1) {
                vortexManager.active = false;
                scene.remove(pivot);
                pivot.children[0].geometry.dispose();
                pivot.children[0].material.dispose();
                pivot.children[1].material.dispose();
                vortexManager.pivot = null;
            }
            break;
        }
    }
}

function updateAttackEffect(time, delta) {
    if (!attackEffectManager.active || !attackEffectManager.sprite) return;

    const anim = attackEffectManager.animation;
    const elapsed = time - anim.startTime;
    const sprite = attackEffectManager.sprite;
    const duration = 1000; // 總持續時間1秒

    sprite.material.rotation += 9 * delta; // 轉速更快

    const progress = Math.min(elapsed / duration, 1);

    // 前半段放大
    const scaleProgress = Math.min(elapsed / (duration * 0.5), 1);
    const scale = 69 * (1 - Math.pow(1 - scaleProgress, 3)); // 緩動放大
    sprite.scale.set(scale, scale, 1);

    // 後半段淡出
    if (elapsed > duration * 0.5) {
        const fadeProgress = Math.min((elapsed - duration * 0.5) / (duration * 0.5), 1);
        sprite.material.opacity = 1.0 - fadeProgress;
    }

    if (progress >= 1) {
        attackEffectManager.active = false;
        scene.remove(sprite);
        attackEffectManager.sprite = null;
    }
}

// --- 鴨子核心功能 ---

function createDucks() {
    if (duckManager.isActive || !loadedModels.duck) return;

    const columnObstacles = obstacles.filter(o => o.userData && o.userData.isMovable === false);

    for (let i = 0; i < DUCK_SETTINGS.COUNT; i++) {
        const duckMesh = createModelInstance('duck', DUCK_SETTINGS.SIZE);
        if (!duckMesh) continue;
        
        const duckRadius = duckMesh.userData.collisionRadius || (DUCK_SETTINGS.SIZE / 2);
        let position;
        let validPosition = false;
        let attempts = 0;

        while (!validPosition && attempts < 100) {
            const spawnBoundary = boundary * 0.9;
            position = new THREE.Vector3(
                (Math.random() - 0.5) * spawnBoundary * 2,
                DUCK_SETTINGS.HEIGHT,
                (Math.random() - 0.5) * spawnBoundary * 2
            );
            
            let isOverlapping = false;
            for (const col of columnObstacles) {
                if (position.distanceTo(col.position) < duckRadius + col.userData.collisionRadius + 2) { // 增加一點緩衝
                    isOverlapping = true; break;
                }
            }
            if (!isOverlapping) {
                for (const otherDuck of duckManager.ducks) {
                    if (position.distanceTo(otherDuck.mesh.position) < duckRadius * 3) {
                        isOverlapping = true; break;
                    }
                }
            }
            
            if (!isOverlapping) validPosition = true;
            else attempts++;
        }

        if (validPosition) {
            duckMesh.position.copy(position);
            duckMesh.visible = false;
            scene.add(duckMesh);

            // [全新] 初始化鴨子的速度
            const initialAngle = Math.random() * Math.PI * 2;
            const initialVelocity = new THREE.Vector3(Math.cos(initialAngle), 0, Math.sin(initialAngle));

            const duck = {
                mesh: duckMesh,
                mixer: null,
                action: null,
                radius: duckRadius,
                state: 'hidden',
                // [全新] 不再有 targetQuaternion，只有 velocity
                velocity: initialVelocity,
                creationTime: performance.now()
            };
            
            if (loadedModels.duck.animations && loadedModels.duck.animations.length > 0) {
                const mixer = new THREE.AnimationMixer(duckMesh);
                const clip = loadedModels.duck.animations[0];
                if (clip) {
                    const action = mixer.clipAction(clip);
                    action.play();
                    duck.mixer = mixer;
                    duck.action = action;
                }
            }
            duckManager.ducks.push(duck);
        }
    }
    duckManager.isActive = true;
}

function updateDucks(time, delta) {
    if (!duckManager.isActive) return;

    const allDucks = duckManager.ducks;
    const columnObstacles = obstacles.filter(o => o.userData && o.userData.isMovable === false);

    for (let i = 0; i < allDucks.length; i++) {
        const duck = allDucks[i];

        if (!duck.mesh || !duck.mesh.parent) continue;
        if (duck.mixer) duck.mixer.update(delta);

        // [!!! 致命錯誤修正 !!!]
        // 之前的程式碼在這裡只改變了狀態，但忘了讓鴨子顯示出來
        if (duck.state === 'hidden') {
            if (time - duck.creationTime > 2000) {
                duck.state = 'visible';
                duck.mesh.visible = true; // <--- 就是遺漏了這一行！！！
            }
            continue; // 在顯示出來之前，不進行任何移動
        }

        // --- 1. 碰撞檢測與速度反彈 ---
        
        // 邊界反彈
        if ((duck.mesh.position.x > boundary - duck.radius && duck.velocity.x > 0) ||
            (duck.mesh.position.x < -boundary + duck.radius && duck.velocity.x < 0)) {
            duck.velocity.x *= -1;
        }
        if ((duck.mesh.position.z > boundary - duck.radius && duck.velocity.z > 0) ||
            (duck.mesh.position.z < -boundary + duck.radius && duck.velocity.z < 0)) {
            duck.velocity.z *= -1;
        }

        // 柱子反彈
        for (const col of columnObstacles) {
            const distVec = duck.mesh.position.clone().sub(col.position);
            distVec.y = 0;
            const distance = distVec.length();
            const combinedRadius = duck.radius + col.userData.collisionRadius;

            if (distance < combinedRadius) {
                // [穩定性強化] 只有在向量長度大於0時才進行計算，避免產生NaN錯誤
                if (distVec.lengthSq() > 0) {
                    const penetration = combinedRadius - distance;
                    const pushout = distVec.clone().normalize().multiplyScalar(penetration);
                    duck.mesh.position.add(pushout);
                    
                    const normal = distVec.normalize();
                    duck.velocity.reflect(normal);
                }
            }
        }

        // --- 2. 移動 ---
        duck.mesh.position.add(duck.velocity.clone().normalize().multiplyScalar(DUCK_SETTINGS.SPEED * delta));
        
        // --- 3. 更新朝向與動畫 ---
        duck.mesh.rotation.y = Math.atan2(duck.velocity.x, duck.velocity.z);
        duck.mesh.rotation.x = Math.sin(time * 0.001 * DUCK_NOD_SETTINGS.SPEED) * DUCK_NOD_SETTINGS.ANGLE;
    }
}

        function updateBoss(time, delta) {
    if (!bossManager.active || !bossManager.mesh) return;
    const anim = bossManager.animation;
    const now = performance.now();

    if (bossManager.techOrb && bossManager.techOrb.userData.update) {
        bossManager.techOrb.userData.update(time);
    }

    const rotationFix = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI);
    let targetQuaternion = new THREE.Quaternion();
    const tempMatrix = new THREE.Matrix4();
    let targetPosition = new THREE.Vector3();

    switch(bossManager.state) {
        case 'intro': {
            const bossPos = getRandomBossPosition();
            bossManager.mesh.position.copy(bossPos);
            startVortexAnimation(bossPos);
            bossManager.state = 'appearing';
            bossManager.animation = { startTime: now + 1000, duration: 3000 };
            break;
        }
        case 'appearing': {
            const elapsed = now - anim.startTime;
            if (elapsed > 0 && !bossManager.mesh.visible) {
                bossManager.mesh.visible = true;
            }
            if (elapsed >= anim.duration) {
                bossManager.state = 'idle';
                bossManager.nextActionTime = now + 3000 + Math.random() * 2000;
                bossManager.initialIdlePosition = bossManager.mesh.position.clone();
                bossManager.idleMoveTarget = null;
            }
            break;
        }
        case 'idle':
            bossManager.idleFloatTime += delta;
            const moveRadius = 75;
            const arrivalThreshold = 5;
            if (!bossManager.idleMoveTarget || bossManager.mesh.position.distanceTo(bossManager.idleMoveTarget) < arrivalThreshold) {
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * moveRadius;
                const newTarget = bossManager.initialIdlePosition.clone();
                newTarget.x += Math.cos(angle) * distance;
                newTarget.z += Math.sin(angle) * distance;
                bossManager.idleMoveTarget = newTarget;
            }
            bossManager.idleMoveTarget.y = 78 + Math.sin(bossManager.idleFloatTime * 0.5) * 5;
            bossManager.mesh.position.lerp(bossManager.idleMoveTarget, delta * 0.2);

            targetPosition.copy(player.position);
            tempMatrix.lookAt(bossManager.mesh.position, targetPosition, bossManager.mesh.up);
            targetQuaternion.setFromRotationMatrix(tempMatrix).multiply(rotationFix);
            bossManager.mesh.quaternion.slerp(targetQuaternion, delta * 0.5);

            if (now >= bossManager.nextActionTime) {
                const actionRoll = Math.random();
                if (actionRoll < 0.7) {
                    bossManager.state = 'attacking';
                    bossManager.animation = { 
                        startTime: now, 
                        duration: 5000, 
                        waveInterval: 200, 
                        nextWaveTime: now, 
                        projectilesPerWave: 6 + Math.floor(Math.random() * 5),
                        effectTriggered: false // 新增一個旗標，確保特效只觸發一次
                    };
                } else {
                    bossManager.state = 'teleport_start';
                    bossManager.animation = { startTime: now, duration: 1000 };
                }
            }
            break;

        case 'teleport_start': {
            startVortexAnimation(bossManager.mesh.position);
            bossManager.state = 'teleport_out';
            bossManager.animation = { startTime: now + 1000, duration: 2000 };
            break;
        }
        case 'teleport_out': {
            const elapsed = now - anim.startTime;
            if (elapsed >= 0) {
                bossManager.mesh.visible = false;
            }
            if (elapsed >= anim.duration) {
                const newPos = getRandomBossPosition();
                bossManager.mesh.position.copy(newPos);
                startVortexAnimation(newPos);
                bossManager.state = 'teleport_in';
                bossManager.animation = { startTime: now + 1000, duration: 2000 };
            }
            break;
        }
        case 'teleport_in': {
             const elapsed = now - anim.startTime;
             if (elapsed > 0 && !bossManager.mesh.visible) {
                 bossManager.mesh.visible = true;
             }
             if (elapsed >= anim.duration) {
                bossManager.state = 'idle';
                bossManager.nextActionTime = now + (3000 + Math.random() * 2000);
                bossManager.initialIdlePosition = bossManager.mesh.position.clone();
                bossManager.idleMoveTarget = null;
             }
            break;

            if (!attackAnim.effectTriggered) {

            if (now < attackAnim.startTime + attackAnim.duration && now >= attackAnim.nextWaveTime) {
                for (let i = 0; i < attackAnim.projectilesPerWave; i++) {
                    const p = bossManager.attackProjectiles.states.find(proj => !proj.active);
                    if (p) {
                        p.active = true;
                        p.spawnTime = now;
                        p.scale = 0;

                        const spawnOffset = new THREE.Vector3(0, 35, 30);
                        spawnOffset.applyQuaternion(bossManager.mesh.quaternion);
                        p.position.copy(bossManager.mesh.position).add(spawnOffset);
                        const targetOffset = new THREE.Vector3( (Math.random() - 0.5) * 80, 0, (Math.random() - 0.5) * 80 );
                        const target = player.position.clone().add(targetOffset);

                    }
                }
                attackAnim.nextWaveTime = now + attackAnim.waveInterval;
            }

            if (now >= attackAnim.startTime + attackAnim.duration) {
                bossManager.state = 'idle';
                bossManager.nextActionTime = now + (4000 + Math.random() * 3000);
                bossManager.initialIdlePosition = bossManager.mesh.position.clone();
                bossManager.idleMoveTarget = null;

    }

    let matrixNeedsUpdate = false;
    const dummy = new THREE.Object3D();
    const projectileRadius = 1.2;

    bossManager.attackProjectiles.states.forEach((p, i) => {
        if (!p.active) return;
        p.position.add(p.velocity.clone().multiplyScalar(delta));
        const lifeTime = now - p.spawnTime;
        p.scale = Math.min(1.0, lifeTime / 200.0);
        let hit = false;
        if (p.position.y <= projectileRadius) { 
            hit = true;
        }
        if (!hit) {
            const playerDist = Math.hypot(p.position.x - player.position.x, p.position.z - player.position.z);
            if (playerDist < projectileRadius + playerRadius) {
                takeDamage(3, true);
                 hit = true;

        if (!hit) {
             for(const obs of obstacles) {
                if (obs.userData.isPortalBlocker && !exit_portal.visible) continue;
                const obsRadius = obs.userData.collisionRadius || 1;
                const distXZ = Math.hypot(p.position.x - obs.position.x, p.position.z - obs.position.z);
                if (distXZ < obsRadius + projectileRadius) {
                    hit = true;
                    break;
                }
            }
        }
        if (hit) {
            p.active = false;
            p.scale = 0;
        }
        dummy.position.copy(p.position);
        dummy.scale.set(p.scale, p.scale, p.scale);
        dummy.updateMatrix();
        bossManager.attackProjectiles.mesh.setMatrixAt(i, dummy.matrix);
        matrixNeedsUpdate = true;
    });

    if (matrixNeedsUpdate) {

        function updateBird(time, delta) {

            if (skyCycleState === 'day' || skyCycleState === 'fadingToDay') {

                const directionToPlayer = player.position.clone().sub(bird.position);
                directionToPlayer.y = 0; 
                const distanceToPlayer = directionToPlayer.length();
                
                if (distanceToPlayer > 0.1) {
                    const targetAngle = Math.atan2(directionToPlayer.x, directionToPlayer.z);
                    let angleDiff = targetAngle - bird.rotation.y;
                    while (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;
                    while (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
                    bird.rotation.y += angleDiff * delta * 4.0; 
                }
               
                if (distanceToPlayer < 4) { 
                    statusEffectManager.addStatus('huntingMark', 15); // 使用新的管理器，持續15秒
                    birdManager.state = 'arc';

            } else { 
                moveSpeed = birdManager.speed;
                bird.rotation.y += birdManager.arcData.turnRate * delta;

                if (Math.abs(bird.position.x) > boundary - 10 || Math.abs(bird.position.z) > boundary - 10) {
                    const directionToCenter = new THREE.Vector3(0, 0, 0).sub(bird.position).normalize();
                    const targetAngle = Math.atan2(directionToCenter.x, directionToCenter.z);

                    while (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;
                    while (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
                    birdManager.arcData.turnRate = Math.sign(angleDiff) * Math.abs(birdManager.arcData.turnRate);

            const forward = new THREE.Vector3(0, 0, 1);

            bird.position.add(forward.multiplyScalar(moveSpeed * delta));
            bird.position.y = 0.1;

        function createLissajousCurve({A, B, C, a, b, c}) {
            const points = [];
            const delta = Math.PI / 2;
            const numPoints = 1000;
            for (let i = 0; i <= numPoints; i++) {
                const t = (i / numPoints) * Math.PI * 2;
                const x = A * Math.sin(a * t + delta);
                const y = B * Math.sin(b * t);
                const z = C * Math.sin(c * t);
                points.push(new THREE.Vector3(x, y, z));
            }
            return new THREE.CatmullRomCurve3(points, true);
        }

        function createSymbolTexture(symbol, color, size = 256) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const context = canvas.getContext('2d');
            context.fillStyle = 'rgba(0,0,0,0)';
            context.fillRect(0, 0, size, size);
            context.font = `bold ${size * 0.8}px Arial`;
            context.fillStyle = color;
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText(symbol, size / 2, size / 2 + size * 0.05);
            return new THREE.CanvasTexture(canvas);
        }

        function createGlowSymbolTexture(symbol, symbolColor, glowColor1, glowColor2, size = 512, glowScale = 1.0) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const center = size / 2;
            
            const gradient = ctx.createRadialGradient(center, center, 0, center, center, center * glowScale);
            gradient.addColorStop(0, glowColor1);
            gradient.addColorStop(0.6, glowColor2);
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);

            ctx.font = `bold ${size * 0.5}px Arial`;
            ctx.fillStyle = symbolColor;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'black';
            ctx.shadowBlur = 10;
            ctx.fillText(symbol, center, center + size * 0.03);

            return new THREE.CanvasTexture(canvas);
        }


        function createOrbMaterial() {
            const vertexShader = `
                varying vec3 vNormal;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `;
            const fragmentShader = `
                varying vec3 vNormal;
                void main() {
                    float intensity = 0.6 + pow(0.8 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 1.5);
                    vec3 color1 = vec3(0.1, 0.8, 1.0); // Cyan
                    vec3 color2 = vec3(0.1, 1.0, 0.5); // Green
                    vec3 finalColor = mix(color1, color2, vNormal.y * 0.5 + 0.5);
                    gl_FragColor = vec4(finalColor, 1.0) * intensity;
                }
            `;
            return new THREE.ShaderMaterial({
                vertexShader,
                fragmentShader,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
            });
        }
        
        function createLissajousFigure() {
            let symbolsPool = [...ZODIAC_SYMBOLS];
            requiredSymbols = [];
            for (let i = 0; i < 6; i++) {
                const randomIndex = Math.floor(Math.random() * symbolsPool.length);
                requiredSymbols.push(symbolsPool.splice(randomIndex, 1)[0]);
            }
            let orbSymbols = [...requiredSymbols, ...requiredSymbols];
            for (let i = orbSymbols.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [orbSymbols[i], orbSymbols[j]] = [orbSymbols[j], orbSymbols[i]];
            }

            const figureParams = { A: 75, B: 75, C: 75, a: 4, b: 3, c: 7 };
            const curve = createLissajousCurve(figureParams);
            
            lissajousFigure.group = new THREE.Group();
            lissajousFigure.orbs = [];
            lissajousFigure.curve = curve;
            const orbGeo = new THREE.SphereGeometry(8, 32, 16);

            for(let i=0; i<12; i++){
                const orbMesh = new THREE.Mesh(orbGeo, createOrbMaterial());
                
                const symbol = orbSymbols[i];
                const symbolTexture = createSymbolTexture(symbol, '#66ccff', 256);
                const symbolMaterial = new THREE.SpriteMaterial({ map: symbolTexture, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.9 });
                const symbolSprite = new THREE.Sprite(symbolMaterial);
                symbolSprite.scale.set(10, 10, 10);
                orbMesh.add(symbolSprite);
                orbMesh.userData.symbol = symbol;

                lissajousFigure.group.add(orbMesh);
                lissajousFigure.orbs.push({ mesh: orbMesh, progress: Math.random(), speed: 0.02 + Math.random() * 0.03 });
            }
            lissajousFigure.group.position.set(0, 78, 0);
            scene.add(lissajousFigure.group);
        }

        function createSummoningCircle() {
            summoningCircle.group = new THREE.Group();
            summoningCircle.symbols = [];
            const radius = 96 / 2;

            for (let i = 0; i < 12; i++) {
                const symbol = ZODIAC_SYMBOLS[i];
                const angle = (i / 12) * Math.PI * 2;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                
                const whiteGlowTexture = createGlowSymbolTexture(symbol, '#FFFFFF', 'rgba(255, 255, 255, 1.0)', 'rgba(200, 200, 255, 0.6)', 512, 0.9);
                const goldGlowTexture = createGlowSymbolTexture(symbol, '#FFFFE0', 'rgba(255, 223, 100, 1.0)', 'rgba(255, 180, 0, 0.6)', 512, 1.05);

                const material = new THREE.SpriteMaterial({
                    map: whiteGlowTexture,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                });

                const sprite = new THREE.Sprite(material);
                sprite.position.set(x, 5.5, z);
                sprite.scale.set(20, 20, 20);

                const symbolObject = {
                    mesh: sprite,
                    symbol: symbol,
                    isActive: false,
                    whiteTexture: whiteGlowTexture,
                    goldTexture: goldGlowTexture,
                    lastTouchTime: 0
                };
                summoningCircle.symbols.push(symbolObject);
                summoningCircle.group.add(sprite);
            }
            summoningCircle.group.position.set(0, 0.1, 0);
            scene.add(summoningCircle.group);
        }
        
        function updateLissajousFigure(time, delta) {
            if (!lissajousFigure.active || !lissajousFigure.group || !lissajousFigure.curve || summoningCircle.puzzleSolved) return;
            
            lissajousFigure.group.rotation.y -= delta * 0.08;
            lissajousFigure.group.rotation.z += delta * 0.06;

            lissajousFigure.orbs.forEach(orb => {
                orb.progress = (orb.progress + orb.speed * delta) % 1;
                const newPos = lissajousFigure.curve.getPointAt(orb.progress);
                orb.mesh.position.copy(newPos);
            });
        }

        function updateSummoningCircle(time, delta) {
            if (!summoningCircle.active || !summoningCircle.group || summoningCircle.puzzleSolved) return;
            const worldPos = new THREE.Vector3();
            
            summoningCircle.symbols.forEach((symbolObj, i) => {
                symbolObj.mesh.rotation.y += delta * 0.4;
                symbolObj.mesh.position.y = 5.5 + Math.sin(time * 0.0025 + i * 0.5) * 0.5;

                symbolObj.mesh.getWorldPosition(worldPos);

                if (player.position.distanceTo(worldPos) < 8 && time - symbolObj.lastTouchTime > 2400) {
                    symbolObj.isActive = !symbolObj.isActive;
                    const newTexture = symbolObj.isActive ? symbolObj.goldTexture : symbolObj.whiteTexture;
                    if (symbolObj.mesh.material.map !== newTexture) {
                        symbolObj.mesh.material.map = newTexture;
                        symbolObj.mesh.material.needsUpdate = true;
                    }
                    symbolObj.lastTouchTime = time;
                    checkSummoningPuzzle(time);
                }
            });
        }

        function checkSummoningPuzzle(time) {
             if (summoningCircle.puzzleSolved) return;
             const activeSymbols = summoningCircle.symbols.filter(s => s.isActive).map(s => s.symbol);
             if (activeSymbols.length !== 6) return;

             const activeSet = new Set(activeSymbols);
             const requiredSet = new Set(requiredSymbols);

             if (activeSet.size === requiredSet.size && [...activeSet].every(symbol => requiredSet.has(symbol))) {
                summoningCircle.puzzleSolved = true;
                startSummoningAnimation(time);
             }
        }

        function startSummoningAnimation(time) {

        function updateSummoningAnimation(time, delta) {
            if (!summoningCircle.animation.active) return;
            const anim = summoningCircle.animation;
            const elapsed = time - anim.startTime;

            switch(anim.state) {
                case 'ring_appearing':
                    anim.ring.material.opacity = Math.min(1, elapsed / 1000);
                    if (elapsed > 1500) {
                        anim.state = 'hexagram_appearing';
                         const center = summoningCircle.group.position;
                         const size = 87 / 2 * 0.866;
                         
                         const hexagramGroup = new THREE.Group();
                         const shape = new THREE.Shape();
                         const createTriangle = (shape, size, reverse) => {
                            const angleOffset = reverse ? Math.PI : 0;
                            shape.moveTo(size * Math.cos(angleOffset), size * Math.sin(angleOffset));
                            shape.lineTo(size * Math.cos(angleOffset + 2/3 * Math.PI), size * Math.sin(angleOffset + 2/3 * Math.PI));
                            shape.lineTo(size * Math.cos(angleOffset + 4/3 * Math.PI), size * Math.sin(angleOffset + 4/3 * Math.PI));
                            shape.closePath();
                         }
                         createTriangle(shape, size, false);
                         createTriangle(shape, size, true);

                         const hexFillMat = new THREE.MeshBasicMaterial({ color: 0xFFFFE0, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
                         const hexFill = new THREE.Mesh(new THREE.ShapeGeometry(shape), hexFillMat);
                         
                         const hexOutlineMat = new THREE.LineBasicMaterial({ color: 0xFFD700, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, linewidth: 20 });
                         const points = shape.getPoints();
                         const hexOutline = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(points), hexOutlineMat);
                         hexagramGroup.add(hexFill);
                         hexagramGroup.add(hexOutline);
                         
                         hexagramGroup.position.copy(center).y += 0.1;
                         hexagramGroup.rotation.x = -Math.PI / 2;
                         anim.hexagram = hexagramGroup;
                         scene.add(hexagramGroup);
                         
                         const curtainGeo = new THREE.CylinderGeometry(size * 1.05, size * 1.15, 100, 64, 20, true);
                         const curtainMat = new THREE.ShaderMaterial({
                             uniforms: { time: { value: 0 }},
                             vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
                             fragmentShader: `
                                uniform float time; varying vec2 vUv;
                                void main() {
                                    float line = pow(sin((vUv.x + time * 0.1) * 30.0) * 0.5 + 0.5, 2.0);
                                    float falloff = pow(1.0 - vUv.y, 2.0);
                                    gl_FragColor = vec4(1.0, 0.84, 0.0, line * falloff * 0.7);
                                }`,
                             transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
                         });
                         const lightCurtain = new THREE.Mesh(curtainGeo, curtainMat);
                         lightCurtain.position.copy(center).y += 50;
                         anim.lightCurtain = lightCurtain;
                         scene.add(lightCurtain);
                    }
                    break;
                case 'hexagram_appearing':
                    const hexOpacity = Math.min(1, (elapsed - 1500) / 1000);
                    anim.hexagram.children[1].material.opacity = hexOpacity;
                    anim.hexagram.children[0].material.opacity = 0;
                    if (elapsed > 3000) {
                        anim.state = 'rotating';
                    }
                    break;
                case 'rotating':
                    const rotationElapsed = elapsed - 3000;
                    let speedMultiplier = 1;
                    if (rotationElapsed < 6000) {
                        speedMultiplier = 1 + (rotationElapsed / 6000) * 9;
                    } else {
                        speedMultiplier = 10;
                    }
                    anim.hexagram.rotation.z += delta * 0.5 * speedMultiplier;
                    summoningCircle.group.rotation.y -= delta * 0.3 * speedMultiplier;
                    
                    if (rotationElapsed > 6000) {
                        const fillElapsed = rotationElapsed - 6000;
                        const fillDuration = 3000;
                        const fillOpacity = Math.min(1, fillElapsed / fillDuration);
                        anim.hexagram.children[0].material.opacity = fillOpacity;
                    }

                    if (rotationElapsed > 9000) {
                        anim.state = 'disappearing';
                    }
                    break;
                case 'disappearing':
                    const disappearElapsed = elapsed - (3000 + 9000);
                    const opacity = 1.0 - Math.min(1, disappearElapsed / 1000);
                    anim.ring.material.opacity = opacity;
                    anim.hexagram.children.forEach(child => child.material.opacity = opacity);
                    if(anim.lightCurtain) anim.lightCurtain.material.opacity = opacity;
                    
                    lissajousFigure.group.traverse(child => { if(child.material) child.material.opacity = opacity; });
                    summoningCircle.group.traverse(child => { if(child.material) child.material.opacity = opacity; });

                    if (opacity <= 0) {
                        if (anim.ring.parent) scene.remove(anim.ring);
                        if (anim.hexagram.parent) scene.remove(anim.hexagram);
                        if (anim.lightCurtain.parent) scene.remove(anim.lightCurtain);
                        if (summoningCircle.group.parent) scene.remove(summoningCircle.group);
                        if (lissajousFigure.group.parent) scene.remove(lissajousFigure.group);
                        anim.active = false;
                        lissajousFigure.active = false;
                        summoningCircle.active = false;
                    }
                    break;
            }
            if (anim.lightCurtain) {
                anim.lightCurtain.material.uniforms.time.value = time * 0.001;
            }
        }
        
        function onTouchStart(event) { event.preventDefault(); if (!gameStarted) return; const touch = event.changedTouches[0]; if (touch.clientX < window.innerWidth / 2) { if (!joystick.active) { joystick.id = touch.identifier; joystick.active = true; joystick.startX = touch.clientX; joystick.startY = touch.clientY; joystick.base.style.left = `${touch.clientX - 60}px`; joystick.base.style.top = `${touch.clientY - 60}px`; joystick.handle.style.left = `${touch.clientX - 30}px`; joystick.handle.style.top = `${touch.clientY - 30}px`; joystick.base.style.display = 'block'; joystick.handle.style.display = 'block'; } } else { if (!look.active) { look.id = touch.identifier; look.active = true; look.lastX = touch.clientX; look.lastY = touch.clientY; } } }
        
        function onTouchMove(event) { 
            event.preventDefault(); if (!gameStarted) return; 
            for (let touch of event.changedTouches) { 
                if (touch.identifier === joystick.id) { 
                    const vecX = touch.clientX - joystick.startX, vecY = touch.clientY - joystick.startY; 
                    let dist = Math.hypot(vecX, vecY); 
                    const angle = Math.atan2(vecY, vecX); 
                    if (dist > joystick.maxDist) dist = joystick.maxDist; 
                    direction.x = (Math.cos(angle) * dist) / joystick.maxDist; 
                    direction.z = (Math.sin(angle) * dist) / joystick.maxDist; 
                    joystick.handle.style.left = `${joystick.startX + Math.cos(angle) * dist - 30}px`; 
                    joystick.handle.style.top = `${joystick.startY + Math.sin(angle) * dist - 30}px`; 
                } else if (touch.identifier === look.id) { 
                    if(playerLookDisabled) { look.lastX = touch.clientX; look.lastY = touch.clientY; return; } 
                    const movementX = (touch.clientX - look.lastX) * 0.007, movementY = (touch.clientY - look.lastY) * 0.007; 
                    player.rotation.y -= movementX; 
                    camera.rotation.x -= movementY; 
                    camera.rotation.x = Math.max(-PI_2, Math.min(PI_2, camera.rotation.x)); 
                    look.lastX = touch.clientX; 
                    look.lastY = touch.clientY; 
                } 
            } 
        }

        function onTouchEnd(event) { if (!gameStarted) return; for (let touch of event.changedTouches) { if (touch.identifier === joystick.id) { joystick.id = -1; joystick.active = false; joystick.base.style.display = 'none'; joystick.handle.style.display = 'none'; direction.x = 0; direction.z = 0; } else if (touch.identifier === look.id) { look.id = -1; look.active = false; } } }

function addPCControls() {
    const keyStates = {};
